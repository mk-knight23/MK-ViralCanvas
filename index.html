<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MK ViralCanvas — Social Image, Meme &amp; Content Creator</title>
    <meta
      name="description"
      content="Create memes, social media graphics, and shareable visual content. Free browser-based image editor with templates and export."
    />
    <meta
      name="keywords"
      content="meme creator, meme generator, social media graphics, image editor, viral content, MK ViralCanvas"
    />
    <meta name="author" content="Kazi Musharraf" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://19-web-viral-creator.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MK ViralCanvas — Meme & Content Creator" />
    <meta
      property="og:description"
      content="Create memes, social media graphics, and shareable visual content. Free browser-based image editor with templates and export."
    />
    <meta property="og:url" content="https://19-web-viral-creator.vercel.app/" />
    <meta property="og:site_name" content="MK ViralCanvas" />

    <!-- Twitter. No twitter:card type is declared until a real og:image /
         twitter:image asset exists — summary_large_image with a 404ing
         image renders a broken share card. -->
    <meta name="twitter:title" content="MK ViralCanvas — Meme & Content Creator" />
    <meta
      name="twitter:description"
      content="Create memes, social media graphics, and shareable visual content. Free browser-based image editor with templates and export."
    />

    <!-- Default = signature-dark page ink; utils/theme.ts re-stamps this
         per active theme (dark #0E1116 / light #F6F7F9 / hc #000000). -->
    <meta name="theme-color" content="#0E1116" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "MK ViralCanvas",
        "description": "Free online meme generator. Create custom memes with templates, upload images, add text, and download in HD.",
        "url": "https://19-web-viral-creator.vercel.app/",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "Kazi Musharraf",
          "url": "https://www.mkazi.live",
          "sameAs": ["https://github.com/mk-knight23"]
        },
        "creator": {
          "@type": "Person",
          "name": "Kazi Musharraf",
          "url": "https://www.mkazi.live"
        },
        "isAccessibleForFree": true,
        "browserRequirements": "Requires modern browser with JavaScript enabled"
      }
    </script>

    <!--
      Analytics activation: GTM/GA4 load only when VITE_GTM_ID / VITE_GA4_ID
      are set at build time — see src/utils/loadAnalytics.ts (kept out of an
      inline script so the CSP needs no 'unsafe-inline' for scripts). Vercel
      Web Analytics + Speed Insights are enabled from the Vercel dashboard
      and injected server-side. See docs/ANALYTICS.md.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Night Studio type: Space Grotesk (display 500–700) + Inter (UI
         400–600) + JetBrains Mono (coordinates/values 400–500). Weights
         deliberately trimmed to the ones the design uses. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
